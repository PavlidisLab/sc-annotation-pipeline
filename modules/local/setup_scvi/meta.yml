name: setup_scvi
description: Downloads scVI model from CellxGene census for specified organism and version
keywords:
  - scvi
  - cellxgene
  - single-cell
  - model
tools:
  - scvi:
      description: scVI (single-cell Variational Inference) is a probabilistic model for single-cell transcriptomics data
      homepage: https://scvi-tools.org/
      documentation: https://docs.scvi-tools.org/
      licence: ["BSD-3-Clause"]

input:
  - organism:
      type: string
      description: Organism name (e.g., mus_musculus, homo_sapiens)
  - census_version:
      type: string
      description: CellxGene census version (e.g., 2024-07-01)

output:
  - model_path:
      type: directory
      description: Directory containing the downloaded scVI model
      pattern: "scvi-*/"

authors:
  - "@rachadele"
maintainers:
  - "@rachadele"
