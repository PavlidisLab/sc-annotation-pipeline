name: process_qc
description: Performs QC analysis including outlier detection, marker expression, and visualization
keywords:
  - qc
  - quality-control
  - outlier-detection
  - single-cell
tools:
  - scanpy:
      description: Single-Cell Analysis in Python
      homepage: https://scanpy.readthedocs.io/
      documentation: https://scanpy.readthedocs.io/
      licence: ["BSD-3-Clause"]

input:
  - meta:
      type: map
      description: Groovy Map containing sample metadata
  - predicted_meta_files:
      type: file
      description: Predicted cell type files
  - study_path:
      type: directory
      description: Path to study data
  - sample_meta:
      type: file
      description: Sample metadata from Gemma
  - gene_mapping:
      type: file
      description: Gene ID mapping file
  - rename_file:
      type: file
      description: Cell type renaming file
  - nmads:
      type: integer
      description: Number of MADs for outlier detection
  - organism:
      type: string
      description: Organism name
  - markers_file:
      type: file
      description: Cell type marker genes file
  - cell_type_keys:
      type: list
      description: Cell type annotation keys

output:
  - plots:
      type: file
      description: QC visualization plots
      pattern: "**png"
  - qc_dir:
      type: directory
      description: QC output directory
  - mask_files:
      type: file
      description: Outlier mask files
      pattern: "*mask.tsv"

authors:
  - "@rachadele"
maintainers:
  - "@rachadele"
