name: load_cta
description: Uploads cell type annotations to Gemma database
keywords:
  - gemma
  - upload
  - cell-type
  - annotation

input:
  - meta:
      type: map
      description: Groovy Map containing study metadata
  - celltype_file:
      type: file
      description: Cell type annotation TSV file
  - use_staging:
      type: boolean
      description: Whether to use Gemma staging environment
  - protocol:
      type: string
      description: Cell type assignment protocol identifier; the CTA name is this plus the level
  - protocol_description:
      type: string
      description: One-line description recording the settings behind the protocol (version, classifier, census, references, ref tag, subsample_ref, cutoff, repository); used to create the protocol in Gemma if it does not exist
  - preferred_cta_level:
      type: string
      description: Preferred cell type annotation level

output:
  - message:
      type: file
      description: Gemma CLI output, including the addProtocol output
      pattern: "message.txt"

authors:
  - "@rachadele"
maintainers:
  - "@rachadele"
