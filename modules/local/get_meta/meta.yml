name: get_meta
description: Fetches sample metadata from Gemma database API
keywords:
  - gemma
  - metadata
  - api

input:
  - meta:
      type: map
      description: Groovy Map containing study metadata
  - study_path:
      type: directory
      description: Path to study data

output:
  - meta:
      type: file
      description: Sample metadata TSV
      pattern: "**/sample_meta.tsv"

authors:
  - "@rachadele"
maintainers:
  - "@rachadele"
