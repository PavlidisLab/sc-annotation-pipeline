report_comment: >
  This report has been generated by the <a href="https://github.com/PavlidisLab/sc-annotation-pipeline" target="_blank">PavlidisLab/sc-annotation-pipeline</a>
  analysis pipeline.

data_format: 'yaml'

run_modules:
    - custom_content

custom_data:

  celltype_umap:
    section_name: 'Cell type UMAP'
    description: 'UMAP of the cell type labels, sample names and leiden clusters'
    file_format: 'png'


  sample_celltype_composition_class:
    section_name: 'Sample cell type composition (class)'
    description: 'Composition per sample of predicted class cell types'
    file_format: 'tsv'
    plot_type: 'barplot'

  sample_celltype_composition_subclass:
    section_name: 'Sample cell type composition (subclass)'
    description: 'Composition per sample of predicted subclass cell types'
    file_format: 'tsv'
    plot_type: 'barplot'

  sample_celltype_composition_family:
    section_name: 'Sample cell type composition (family)'
    description: 'Composition per sample of predicted family cell types'
    file_format: 'tsv'
    plot_type: 'barplot'

  celltype_sample_composition_class:
    section_name: 'Cell type sample composition (class)'
    description: 'Composition per class cell type of samples'
    file_format: 'tsv'
    plot_type: 'barplot'

  celltype_sample_composition_subclass:
    section_name: 'Cell type sample composition (subclass)'
    description: 'Composition per subclass cell type of samples'
    file_format: 'tsv'
    plot_type: 'barplot'

  celltype_sample_composition_family:
    section_name: 'Cell type sample composition (family)'
    description: 'Composition per family cell type of samples'
    file_format: 'tsv'
    plot_type: 'barplot'


  cluster_celltype_composition_class:
    section_name: 'Leiden cluster composition (class)'
    description: 'Leiden clustering composition for class cell types'
    file_format: 'tsv'
    plot_type: 'barplot'

  cluster_celltype_composition_subclass:
    section_name: 'Leiden cluster composition (subclass)'
    description: 'Leiden clustering composition for subclass cell types'
    file_format: 'tsv'
    plot_type: 'barplot'

  cluster_celltype_composition_family:
    section_name: 'Leiden cluster composition (family)'
    description: 'Leiden clustering composition for family cell types'
    file_format: 'tsv'
    plot_type: 'barplot'

  markers_heatmap_subclass:
    section_name: 'Cell type markers (subclass)'
    description: 'Expression of select markers. Count are averaged across cell-type labels and z-score normalized across genes.'
    file_format: 'tsv'
    plot_type: 'heatmap'

  markers_heatmap_class:
    section_name: 'Cell type markers (class)'
    description: 'Expression of select markers averaged across class cell-type labels and z-score normalized across genes.'
    file_format: 'tsv'
    plot_type: 'heatmap'

  markers_heatmap_family:
    section_name: 'Cell type markers (family)'
    description: 'Expression of select markers averaged across family cell-type labels and z-score normalized across genes.'
    file_format: 'tsv'
    plot_type: 'heatmap'

  mask_stats_by_class:
    section_name: 'Outlier Types by Cell Type (class)'
    description: 'Count of each outlier type per class cell type (not mutually exclusive)'
    file_format: 'tsv'
    plot_type: 'table'

  mask_stats_by_subclass:
    section_name: 'Outlier Types by Cell Type (subclass)'
    description: 'Count of each outlier type per subclass cell type (not mutually exclusive)'
    file_format: 'tsv'
    plot_type: 'table'

  mask_stats_by_family:
    section_name: 'Outlier Types by Cell Type (family)'
    description: 'Count of each outlier type per family cell type (not mutually exclusive)'
    file_format: 'tsv'
    plot_type: 'table'


sp:

  celltype_umap:
    fn: "*celltype_umap_mqc.png"

  markers_table:
    fn: "*cell_type_markers_mqc.tsv"

  sample_celltype_composition_class:
    fn: "*sample_counts_mqc_class_cell_type.tsv"
  sample_celltype_composition_subclass:
    fn: "*sample_counts_mqc_subclass_cell_type.tsv"
  sample_celltype_composition_family:
    fn: "*sample_counts_mqc_family_cell_type.tsv"

  celltype_sample_composition_class:
    fn: "*celltype_counts_mqc_class_cell_type.tsv"
  celltype_sample_composition_subclass:
    fn: "*celltype_counts_mqc_subclass_cell_type.tsv"
  celltype_sample_composition_family:
    fn: "*celltype_counts_mqc_family_cell_type.tsv"


  cluster_celltype_composition_class:
    fn: "*cluster_celltypes_mqc_class_cell_type.tsv"
  cluster_celltype_composition_subclass:
    fn: "*cluster_celltypes_mqc_subclass_cell_type.tsv"
  cluster_celltype_composition_family:
    fn: "*cluster_celltypes_mqc_family_cell_type.tsv"

  markers_heatmap_subclass:
    fn: "*_subclass_cell_type_heatmap_mqc.tsv"
  markers_heatmap_class:
    fn: "*_class_cell_type_heatmap_mqc.tsv"
  markers_heatmap_family:
    fn: "*_family_cell_type_heatmap_mqc.tsv"

  mask_stats_by_class:
    fn: "*mask_stats_by_class_cell_type_mqc.tsv"
  mask_stats_by_subclass:
    fn: "*mask_stats_by_subclass_cell_type_mqc.tsv"
  mask_stats_by_family:
    fn: "*mask_stats_by_family_cell_type_mqc.tsv"

custom_content:
  order:
    - mask_stats_by_subclass
    - mask_stats_by_class
    - mask_stats_by_family
    - celltype_sample_composition_subclass
    - sample_celltype_composition_subclass
    - celltype_sample_composition_class
    - sample_celltype_composition_class
    - celltype_sample_composition_family
    - sample_celltype_composition_family
    - cluster_celltype_composition_subclass
    - cluster_celltype_composition_class
    - cluster_celltype_composition_family
    - markers_heatmap_subclass
    - markers_heatmap_class
    - markers_heatmap_family
    - celltype_umap

